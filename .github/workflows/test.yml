name: Tests

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

env:
  CARGO_TERM_COLOR: always

jobs:
  testing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build & test
        run: cargo test --workspace --all-features --no-fail-fast
      - name: Test the generated code in a no_std crate
        run: cargo test --manifest-path test/wasm/Cargo.toml
  wasm-testing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: test/wasm
      - uses: jetli/wasm-pack-action@v0.4.0
      - name: Test the generated code in Node.js
        run: wasm-pack test --node test/wasm
      - name: Build a wasm package
        run: wasm-pack build test/wasm
