[workspace]
members = [".", "syn"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.100.0"
license = "Apache-2.0"
repository = "https://github.com/rust-amplify/amplify-derive"

[workspace.dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "3", features = ["full", "extra-traits"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"

[package]
name = "amplify_derive"
version = "5.0.0"
description = "Powerful derivation macros; part of the 'amplify' library"
authors = [
    "Dr. Maxim Orlovsky <dr@orlovsky.ch>",
    "Elichai Turkel <elichai.turkel@gmail.com>"
]
keywords = ["generics", "derive", "wrap", "patterns"]
categories = ["data-structures", "rust-patterns", "development-tools"]
repository.workspace = true
homepage = "https://github.com/rust-amplify"
rust-version.workspace = true
edition.workspace = true
license.workspace = true
readme = "README.md"
include = ["src/**", "tests/**", "README.md", "CHANGELOG.md", "LICENSE"]

[lib]
proc-macro = true

[dependencies]
quote.workspace = true
syn.workspace = true
proc-macro2.workspace = true
amplify_syn = { version = "3.0.0", path = "syn" }

[dev-dependencies]
amplify = { version = "4.0.0", default-features = false, features = ["std", "hex"] }
prettyplease = "0.3"
trybuild = "1"

[lints]
workspace = true
